<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Iniciar sesión</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="16x16" href="manzanas.png">
  <link rel="icon" type="image/png" sizes="32x32" href="manzanas.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="admin-login.css" />

  <!-- Firebase (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="login">
  <!-- Fondo -->
  <div class="bg">
    <div class="bg__gradient"></div>
    <div class="bg__noise"></div>
    <div class="bg__orbs">
      <span class="orb orb--1"></span>
      <span class="orb orb--2"></span>
      <span class="orb orb--3"></span>
    </div>
  </div>

  <!-- Contenido -->
  <main class="card" aria-label="Formulario de acceso de administrador">
    <div class="card__brand">
      <img src="FondoClaro.png" alt="Logo" class="brand__logo" />
      <div class="brand__text">
        <h1 class="brand__title">Panel Admin</h1>
        <p class="brand__subtitle">Accede con tu correo y contraseña</p>
      </div>
    </div>

    <form id="loginForm" class="form" novalidate>
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required placeholder="admin@empresa.com" />
        <small class="hint" id="emailHint">Usa tu correo corporativo</small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password">
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" aria-describedby="capsHint" />
          <button type="button" class="password__toggle" aria-label="Mostrar u ocultar contraseña" title="Mostrar/ocultar"></button>
        </div>
        <small class="hint hint--caps" id="capsHint" hidden>Bloq Mayús activado</small>
      </div>

      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="remember" checked />
          <span>Recordar sesión</span>
        </label>
        <a class="link" href="#" id="restoreDemo">¿Olvidaste tu contraseña?</a>
      </div>

      <button id="btnLogin" type="submit" class="btn">
        <span class="btn__spinner" aria-hidden="true"></span>
        <span class="btn__text">Iniciar sesión</span>
      </button>

      <p id="status" class="status" role="alert" aria-live="polite"></p>
    </form>

    <footer class="footer">
      <p>© <span id="year"></span> GA Hospitality </p>
    </footer>
  </main>

  <script>
    // ——— Año dinámico
    document.getElementById('year').textContent = new Date().getFullYear();

    // ——— UI: Mostrar/ocultar contraseña
    const pwd = document.getElementById('password');
    const toggle = document.querySelector('.password__toggle');
    toggle.addEventListener('click', () => {
      const showing = pwd.type === 'text';
      pwd.type = showing ? 'password' : 'text';
      toggle.classList.toggle('is-on', !showing);
      toggle.setAttribute('aria-pressed', String(!showing));
      pwd.focus();
    });

    // ——— UI: Aviso de Caps Lock
    const capsHint = document.getElementById('capsHint');
    function capsHandler(e){
      const caps = e.getModifierState && e.getModifierState('CapsLock');
      capsHint.hidden = !caps;
    }
    pwd.addEventListener('keyup', capsHandler);
    pwd.addEventListener('keydown', capsHandler);

    // ——— Parallax suave en la tarjeta
    const card = document.querySelector('.card');
    let px = 0, py = 0;
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 6;
      const y = (e.clientY / window.innerHeight - 0.5) * 6;
      px += (x - px) * 0.06;
      py += (y - py) * 0.06;
      card.style.transform = `translateZ(0) rotateX(${ -py }deg) rotateY(${ px }deg)`;
    }, { passive: true });

    // ——— Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCun-sPsiEJMphATcHHZ_QFU4y_ZcGThYk",
      authDomain: "wendysunifi.firebaseapp.com",
      projectId: "wendysunifi",
      storageBucket: "wendysunifi.firebasestorage.app",
      messagingSenderId: "507383157033",
      appId: "1:507383157033:web:24fdab81903e3c5cac6738",
      measurementId: "G-K6FJVWCEYK"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Persistencia según "Recordar sesión"
    const remember = document.getElementById('remember');
    async function applyPersistence(){
      await auth.setPersistence(
        remember.checked
          ? firebase.auth.Auth.Persistence.LOCAL
          : firebase.auth.Auth.Persistence.SESSION
      );
    }

    // Redirección si ya está autenticado
    auth.onAuthStateChanged(user => { if (user) location.replace('admin.html'); });

    // ——— Login
    const form = document.getElementById('loginForm');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('btnLogin');

    function setLoading(on){
      btn.disabled = on;
      btn.classList.toggle('is-loading', on);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      setLoading(true);
      try {
        await applyPersistence();
        const email = document.getElementById('email').value.trim();
        const password = pwd.value;

        if (!email || !password) throw new Error('Completa correo y contraseña.');

        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged redirige
      } catch (err) {
        console.error(err);
        card.classList.remove('shake');
        // Triggerea animación de error
        void card.offsetWidth; 
        card.classList.add('shake');
        statusEl.textContent = 'Error de acceso: ' + (err?.message || 'Intenta de nuevo.');
      } finally {
        setLoading(false);
      }
    });

    // ——— Link de recuperación (puedes conectar tu flujo real)
    document.getElementById('restoreDemo').addEventListener('click', (e)=>{
      e.preventDefault();
      statusEl.textContent = 'Si olvidaste tu contraseña, solicita un restablecimiento al administrador.';
    });
  </script>
</body>
</html>
